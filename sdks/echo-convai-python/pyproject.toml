[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "echo-convai"
version = "0.1.0"
description = "Python SDK for Echo ConvAI — real-time conversational AI over WebSocket"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Echo Prime Technologies", email = "dev@echo-ept.com" },
]
keywords = ["convai", "conversational-ai", "websocket", "voice", "realtime"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "websockets>=12.0,<15.0",
    "httpx>=0.27.0,<1.0",
    "pydantic>=2.0,<3.0",
    "sounddevice>=0.4.6,<1.0",
    "numpy>=1.26,<3.0",
    "loguru>=0.7,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
echo-convai-demo = "echo_convai.demo:main"

[tool.hatch.build.targets.wheel]
packages = ["echo_convai"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
